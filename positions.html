<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050807"><title>TradeZora — Positions</title><link rel="stylesheet" href="dashboard.css?v=8"><style>
.page-main{max-width:980px;margin:0 auto;padding:24px 16px 110px}.page-title{font-size:28px;margin:10px 0 6px}.page-sub{color:#8c9993;margin:0 0 22px}.position-page-item,.history-page-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}.position-page-item:last-child,.history-page-item:last-child{border-bottom:0}.position-page-item div,.history-page-item div{display:flex;flex-direction:column;gap:6px}.position-page-item span,.history-page-item span,.history-page-item small,.position-page-item small{color:#8c9993;font-size:13px}.open-status{color:#00e38a}.empty{padding:40px 16px;text-align:center;color:#89958f}.page-panel{padding:0;overflow:hidden}.page-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}.page-head h2{margin:0}.bottom-nav a{text-decoration:none}
</style></head><body>
<div id="overlay" class="overlay"></div><aside id="sideMenu" class="side-menu"><div class="side-head"><div class="side-brand"><span class="brand-mark">TZ</span><span>TradeZora</span></div><button id="closeMenu" class="icon-btn close-btn">×</button></div><div class="profile"><div id="avatar" class="avatar">T</div><div class="profile-info"><strong id="profileName">Demo Trader</strong><span id="profileEmail">demo@tradezora.local</span></div></div><nav class="side-nav"><a href="dashboard.html" class="side-link"><span>▣</span> Trade</a><a href="positions.html" class="side-link active"><span>▥</span> Positions</a><a href="history.html" class="side-link"><span>◷</span> History</a></nav><button id="logout" class="logout-btn">Log out</button></aside>
<header class="topbar"><button id="menuBtn" class="menu-btn"><span></span><span></span><span></span></button><a href="dashboard.html" class="mobile-logo">TradeZora</a><div class="top-spacer"></div><div class="demo-badge">DEMO</div><div class="balance-box"><small>BALANCE</small><strong id="balance">$10,000.00</strong></div><div class="notification-dot">•</div></header>
<main class="page-main"><h1 class="page-title">Open Positions</h1><p class="page-sub">Monitor your active contracts.</p><section class="panel page-panel"><div class="page-head"><h2>Active Trades</h2></div><div id="positionsList"></div></section></main>
<nav class="bottom-nav"><a href="dashboard.html"><span class="nav-icon">▣</span><span>Trade</span></a><a class="active" href="positions.html" aria-current="page"><span class="nav-icon">▥</span><span>Positions</span></a><a href="history.html"><span class="nav-icon">◷</span><span>History</span></a></nav>
<script src="tradezora-engine.js?v=9"></script><script src="account-pages.js?v=2"></script><script>
/* LumiBinary account-aware Positions page renderer.
   The shared engine and dashboard use separate Demo and Real position stores.
   Never clear an open position from this page: the engine must settle it. */
(() => {
  'use strict';

  const $ = (selector) => document.querySelector(selector);
  const modeNow = () => localStorage.getItem('tradezoraAccountMode') === 'real' ? 'real' : 'demo';
  const stores = {
    demo: { positions: 'tradezoraDemoPositions', balance: 'tradezoraDemoBalance' },
    real: { positions: 'tradezoraSandboxPositions', balance: null }
  };
  const safeArray = (key) => {
    try {
      const value = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (_) { return []; }
  };
  const money = (value) => '$' + Number(value || 0).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  let activeMode = null;
  let realBalance = null;
  let realBalanceStatus = 'loading';
  let realBalanceRequestedAt = 0;

  async function refreshRealBalance() {
    const token = localStorage.getItem('tradezoraAuthToken') ||
      localStorage.getItem('session_token') || localStorage.getItem('sessionToken') || '';
    if (!token) {
      realBalance = null;
      realBalanceStatus = 'error';
      updateBalance();
      return;
    }

    realBalanceStatus = 'loading';
    updateBalance();
    try {
      const response = await fetch('https://tradezora-backend-1.onrender.com/api/real-account', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) {
        throw new Error(data.error || `Request failed (${response.status})`);
      }
      const account = data.account || data;
      const value = Number(account.balance);
      if (account.account_type !== 'real' || !Number.isFinite(value) || value < 0) {
        throw new Error('The server returned an invalid real-account balance.');
      }
      realBalance = value;
      realBalanceStatus = 'loaded';
    } catch (error) {
      realBalance = null;
      realBalanceStatus = 'error';
      console.warn('Positions page could not load the real-account balance:', error.message);
    }
    updateBalance();
  }

  function updateBalance() {
    const label = $('.balance-box small');
    const value = $('#balance');
    if (activeMode === 'real') {
      if (label) label.textContent = 'REAL BALANCE';
      if (value) value.textContent = realBalanceStatus === 'loaded'
        ? money(realBalance) : (realBalanceStatus === 'error' ? 'Unavailable' : 'Loading…');
    } else {
      if (label) label.textContent = 'DEMO BALANCE';
      if (value) value.textContent = money(localStorage.getItem(stores.demo.balance) || 10000);
    }
  }

  function syncAccountHeader() {
    const nextMode = modeNow();
    const changed = nextMode !== activeMode;
    activeMode = nextMode;

    const badge = $('.demo-badge');
    if (badge) {
      badge.textContent = activeMode === 'real' ? 'REAL' : 'DEMO';
      badge.setAttribute('aria-label', activeMode === 'real' ? 'Real account' : 'Demo account');
    }
    const subtitle = $('.page-sub');
    if (subtitle) subtitle.textContent = activeMode === 'real'
      ? 'Monitor your active real-account test contracts.'
      : 'Monitor your active demo contracts.';

    updateBalance();
    if (changed && activeMode === 'real') {
      realBalanceRequestedAt = Date.now();
      refreshRealBalance();
    }
    if (changed && activeMode === 'demo') {
      realBalance = null;
      realBalanceStatus = 'loading';
    }
  }

  function addText(parent, tag, className, value) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = value;
    parent.appendChild(element);
    return element;
  }

  function renderPositions() {
    syncAccountHeader();
    const list = $('#positionsList');
    if (!list) return;

    const mode = activeMode || modeNow();
    const positions = safeArray(stores[mode].positions);
    list.replaceChildren();

    if (!positions.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No open positions in this account. Active trades will appear here until they settle.';
      list.appendChild(empty);
      return;
    }

    positions.slice().reverse().forEach((position) => {
      const row = document.createElement('div');
      row.className = 'position-page-item';

      const details = document.createElement('div');
      const type = String(position.type || 'TRADE').toUpperCase();
      const contract = String(position.contract || 'CONTRACT').toUpperCase();
      addText(details, 'strong', '', `${type} · ${contract}`);

      const digit = position.digit !== undefined && position.digit !== null
        ? `Digit ${position.digit}` : 'Digit —';
      const stake = money(position.stake);
      const modeLabel = String(position.mode || 'MANUAL').toUpperCase();
      const market = position.market ? ` · ${String(position.market)}` : '';
      const funding = mode === 'real' && position.fundingSource
        ? ` · ${String(position.fundingSource).toUpperCase()} FUNDS` : '';
      addText(details, 'span', '', `${modeLabel} · ${digit} · ${stake}${market}${funding}`);
      if (position.openedAt) {
        const opened = new Date(Number(position.openedAt));
        if (!Number.isNaN(opened.getTime())) {
          addText(details, 'small', '', `Opened ${opened.toLocaleTimeString()}`);
        }
      }

      const statusWrap = document.createElement('div');
      statusWrap.style.textAlign = 'right';
      const status = addText(statusWrap, 'strong', 'open-status', 'OPEN');
      if (Number(position.settleAt) > Date.now()) {
        const remaining = Math.max(1, Math.ceil((Number(position.settleAt) - Date.now()) / 1000));
        addText(statusWrap, 'small', '', `Settling in ${remaining}s`);
      } else {
        status.textContent = 'AWAITING SETTLEMENT';
        status.style.color = '#f2c45c';
      }

      row.append(details, statusWrap);
      list.appendChild(row);
    });
  }


  function refreshIfNeeded() {
    if (modeNow() !== activeMode) renderPositions();
    else {
      updateBalance();
      renderPositions();
    }
    if (activeMode === 'real' && Date.now() - realBalanceRequestedAt > 60000) {
      realBalanceRequestedAt = Date.now();
      refreshRealBalance();
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderPositions();
    window.addEventListener('tradezora-state-changed', renderPositions);
    window.addEventListener('storage', (event) => {
      if (!event.key || event.key === 'tradezoraAccountMode' ||
          event.key === stores.demo.positions || event.key === stores.real.positions ||
          event.key === stores.demo.balance) renderPositions();
    });
    window.addEventListener('focus', renderPositions);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderPositions();
    });
    window.setInterval(refreshIfNeeded, 1000);
  });
})();

</script></body></html>
