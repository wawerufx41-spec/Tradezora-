<!-- TradeZora per-user demo contract rates panel.
     Insert inside the existing Admin Settings section. Keep existing settings and scripts.
     Uses existing API_BASE and the logged-in admin's bearer token from localStorage/sessionStorage.
     If your admin page uses a different token key, update getAdminToken() below to match it. -->
<section class="card" id="perUserDemoRatesPanel" style="margin-top:18px;padding:18px;border:1px solid #d9e0ea;border-radius:12px">
  <h3 style="margin:0 0 8px">Individual user demo win rates</h3>
  <p style="margin:0 0 14px;color:#64748b">Demo testing only. These controls do not change real-account or live broker outcomes.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
    <label style="display:grid;gap:5px;min-width:220px;flex:1">User ID
      <input id="userDemoRatesUserId" type="text" inputmode="numeric" placeholder="Enter exact user ID" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px">
    </label>
    <button type="button" id="loadUserDemoRates" style="padding:10px 14px;border:0;border-radius:8px;cursor:pointer">Load settings</button>
  </div>
  <label style="display:flex;gap:8px;align-items:center;margin:16px 0">
    <input id="userDemoRatesEnabled" type="checkbox" checked>
    Enable individual contract rates for this user
  </label>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
    <label style="display:grid;gap:5px">EVEN rate
      <select id="userDemoRateEVEN" class="user-demo-rate" data-contract="EVEN"></select>
    </label>
    <label style="display:grid;gap:5px">ODD rate
      <select id="userDemoRateODD" class="user-demo-rate" data-contract="ODD"></select>
    </label>
    <label style="display:grid;gap:5px">MATCH rate
      <select id="userDemoRateMATCH" class="user-demo-rate" data-contract="MATCH"></select>
    </label>
    <label style="display:grid;gap:5px">DIFFER rate
      <select id="userDemoRateDIFFER" class="user-demo-rate" data-contract="DIFFER"></select>
    </label>
    <label style="display:grid;gap:5px">OVER rate
      <select id="userDemoRateOVER" class="user-demo-rate" data-contract="OVER"></select>
    </label>
    <label style="display:grid;gap:5px">UNDER rate
      <select id="userDemoRateUNDER" class="user-demo-rate" data-contract="UNDER"></select>
    </label>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px">
    <button type="button" id="saveUserDemoRates" style="padding:10px 14px;border:0;border-radius:8px;cursor:pointer">Save user rates</button>
    <span id="userDemoRatesStatus" role="status" aria-live="polite" style="color:#64748b"></span>
  </div>
</section>
<script>
(function () {
  'use strict';
  const contracts = ['EVEN', 'ODD', 'MATCH', 'DIFFER', 'OVER', 'UNDER'];
  const $ = id => document.getElementById(id);
  const status = message => { $('userDemoRatesStatus').textContent = message; };

  contracts.forEach(contract => {
    const select = $('userDemoRate' + contract);
    if (!select) return;
    select.innerHTML = '';
    for (let rate = 0; rate <= 100; rate += 10) {
      const option = document.createElement('option');
      option.value = String(rate);
      option.textContent = rate + '%';
      select.appendChild(option);
    }
    select.value = '50';
  });

  // Prefer the same API_BASE/token conventions already used in admin.html.
  function getApiBase() {
    if (typeof window.API_BASE === 'string' && window.API_BASE) return window.API_BASE.replace(/\/$/, '');
    if (typeof API_BASE === 'string' && API_BASE) return API_BASE.replace(/\/$/, '');
    return 'https://tradezora-backend-1.onrender.com';
  }
  function getAdminToken() {
    // Adjust only if the existing admin page stores its session token under another key.
    const keys = ['tradezoraToken', 'token', 'authToken', 'accessToken', 'tradezora_token'];
    for (const store of [localStorage, sessionStorage]) {
      for (const key of keys) {
        const value = store.getItem(key);
        if (value) return value;
      }
    }
    return '';
  }
  async function request(userId, method, body) {
    const token = getAdminToken();
    if (!token) throw new Error('Admin session token was not found. Connect this panel to the token variable already used by admin.html.');
    const response = await fetch(`${getApiBase()}/api/admin/users/${encodeURIComponent(userId)}/demo-contract-settings`, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      ...(body ? { body: JSON.stringify(body) } : {})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || data.message || `Request failed (${response.status})`);
    return data;
  }
  function applySettings(settings) {
    contracts.forEach(contract => {
      const row = settings && settings[contract] || {};
      $('userDemoRate' + contract).value = String(Number.isFinite(Number(row.target_win_rate)) ? row.target_win_rate : 50);
    });
    const anyEnabled = contracts.some(contract => settings && settings[contract] && settings[contract].enabled === true);
    $('userDemoRatesEnabled').checked = anyEnabled;
  }
  $('loadUserDemoRates').addEventListener('click', async () => {
    const userId = $('userDemoRatesUserId').value.trim();
    if (!userId) return status('Enter a user ID first.');
    status('Loading…');
    try {
      const data = await request(userId, 'GET');
      applySettings(data.settings || data.contract_settings || data);
      status('Settings loaded.');
    } catch (error) { status(error.message); }
  });
  $('saveUserDemoRates').addEventListener('click', async () => {
    const userId = $('userDemoRatesUserId').value.trim();
    if (!userId) return status('Enter a user ID first.');
    const enabled = $('userDemoRatesEnabled').checked;
    const settings = {};
    contracts.forEach(contract => {
      settings[contract] = { enabled, target_win_rate: Number($('userDemoRate' + contract).value) };
    });
    status('Saving…');
    try {
      await request(userId, 'PUT', { settings });
      status('Saved successfully for user ID ' + userId + '.');
    } catch (error) { status(error.message); }
  });
})();
</script>
