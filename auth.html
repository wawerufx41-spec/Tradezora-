
<script>
document.addEventListener("DOMContentLoaded", () => {
  const API_BASE = "https://tradezora-backend-use.onrender.com";

  const signupTab = document.getElementById("signupTab");
  const loginTab = document.getElementById("loginTab");
  const signupForm = document.getElementById("signup");
  const loginForm = document.getElementById("login");

  const signupName = document.getElementById("signupName");
  const signupEmail = document.getElementById("signupEmail");
  const signupPassword = document.getElementById("signupPassword");
  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");

  const signupMsg = document.getElementById("signupMsg");
  const loginMsg = document.getElementById("loginMsg");

  function showTab(login) {
    signupTab.classList.toggle("active", !login);
    loginTab.classList.toggle("active", login);
    signupForm.style.display = login ? "none" : "grid";
    loginForm.style.display = login ? "grid" : "none";
    signupMsg.textContent = "";
    loginMsg.textContent = "";
  }

  signupTab.onclick = () => showTab(false);
  loginTab.onclick = () => showTab(true);

  async function sendRequest(path, payload) {
    const response = await fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.success !== true) {
      throw new Error(
        data.error ||
        data.message ||
        `Request failed (${response.status}).`
      );
    }

    return data;
  }

  function saveSession(data) {
    if (!data.session_token || !data.user) {
      throw new Error("The server did not return a valid login session.");
    }

    const user = data.user;

    localStorage.setItem("session_token", data.session_token);
    localStorage.setItem("tradezoraDemoUser", JSON.stringify({
      id: user.id,
      name: user.name,
      email: user.email,
      role: user.role
    }));

    // Keep demo display settings separate from real account funds.
    if (localStorage.getItem("tradezoraDemoBalance") === null) {
      localStorage.setItem("tradezoraDemoBalance", "10000");
    }
    if (localStorage.getItem("tradezoraDemoStake") === null) {
      localStorage.setItem("tradezoraDemoStake", "10");
    }
    if (localStorage.getItem("tradezoraDemoBalanceVersion") === null) {
      localStorage.setItem(
        "tradezoraDemoBalanceVersion",
        localStorage.getItem("tradezoraDemoBalance")
      );
    }
  }

  signupForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = signupName.value.trim();
    const email = signupEmail.value.trim().toLowerCase();
    const password = signupPassword.value;

    if (!name || !email || password.length < 8) {
      signupMsg.style.color = "#ff5d6c";
      signupMsg.textContent =
        "Enter your name and email. Password must be at least 8 characters.";
      return;
    }

    const submitButton = signupForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = "Creating account...";
    signupMsg.style.color = "#16e58a";
    signupMsg.textContent = "Connecting securely to TradeZora...";

    try {
      const data = await sendRequest("/api/auth/register", {
        name,
        email,
        password
      });

      saveSession(data);
      signupMsg.textContent = "Account created. Opening dashboard...";
      window.location.href = "dashboard.html";
    } catch (error) {
      signupMsg.style.color = "#ff5d6c";
      signupMsg.textContent =
        error.message === "Failed to fetch"
          ? "Could not reach the server. Check your connection and try again."
          : error.message;
      submitButton.disabled = false;
      submitButton.textContent = "Create Demo Account";
    }
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = loginEmail.value.trim().toLowerCase();
    const password = loginPassword.value;

    if (!email || !password) {
      loginMsg.style.color = "#ff5d6c";
      loginMsg.textContent = "Enter your email and password.";
      return;
    }

    const submitButton = loginForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = "Logging in...";
    loginMsg.style.color = "#16e58a";
    loginMsg.textContent = "Verifying your account...";

    try {
      const data = await sendRequest("/api/auth/login", {
        email,
        password
      });

      saveSession(data);
      loginMsg.textContent = "Login successful. Opening dashboard...";
      window.location.href = "dashboard.html";
    } catch (error) {
      loginMsg.style.color = "#ff5d6c";
      loginMsg.textContent =
        error.message === "Failed to fetch"
          ? "Could not reach the server. Check your connection and try again."
          : error.message;
      submitButton.disabled = false;
      submitButton.textContent = "Log In";
    }
  });
});
</script>
