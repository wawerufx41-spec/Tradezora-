<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <title>LumiBinary — Reset password</title>
  <style>
    :root{color-scheme:dark;--bg:#050807;--panel:#0c1410;--line:#1c3026;--green:#16e58a;--muted:#9bb0a4;--red:#ff6474}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#10251a 0,#050807 56%);color:#f4fff8;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
    .wrap{width:100%;max-width:440px}
    .brand{text-align:center;margin-bottom:24px}.logo{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--green);color:#03140b;font-weight:900;font-size:24px;box-shadow:0 0 28px #16e58a2a}
    .brand h1{font-size:27px;margin:12px 0 6px;letter-spacing:.2px}.brand p{color:var(--muted);font-size:14px;margin:0}
    .card{background:#0b120fF2;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 70px #0008}
    h2{font-size:21px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5}
    .field{margin:0 0 15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#dce9e0}
    input{width:100%;border:1px solid #263b2f;background:#060b08;color:#f5fff8;border-radius:10px;padding:13px 12px;font-size:15px;outline:none;min-height:46px}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #16e58a19}input::placeholder{color:#64776b}
    .password{display:flex;gap:8px}.password input{flex:1;min-width:0}.show{background:#17231b;color:#cfe4d5;border:1px solid #263b2f;border-radius:10px;padding:0 12px;cursor:pointer;font-size:12px;font-weight:700}
    .primary{width:100%;border:0;border-radius:11px;background:var(--green);color:#04140b;font-weight:800;font-size:15px;padding:14px;min-height:48px;cursor:pointer;margin-top:5px}.primary:disabled{opacity:.6;cursor:wait}
    .message{display:none;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.45;margin:0 0 15px;overflow-wrap:anywhere}.message.error{display:block;background:#341319;border:1px solid #6d2935;color:#ffc5cc}.message.ok{display:block;background:#10291c;border:1px solid #1e6340;color:#baffd6}
    .links{display:flex;justify-content:flex-end;margin-top:13px}.link{background:none;border:0;padding:4px 0;color:var(--green);font-size:13px;cursor:pointer;text-decoration:none}.fine{color:#718579;text-align:center;font-size:11px;line-height:1.6;margin:17px 8px 0}.hidden{display:none!important}
    @media(max-width:380px){body{padding:14px}.card{padding:17px}.brand h1{font-size:24px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><div class="logo" aria-hidden="true">L</div><h1>LumiBinary</h1><p>Securely restore access to your account</p></header>
    <section class="card" aria-label="Reset account password">
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <form id="resetForm" novalidate>
        <h2>Choose a new password</h2>
        <p class="sub">Your reset link is valid for 30 minutes and can only be used once.</p>
        <div class="field"><label for="newPassword">New password</label><div class="password"><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="show" type="button" data-toggle="newPassword">Show</button></div></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><div class="password"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter the password again" required><button class="show" type="button" data-toggle="confirmPassword">Show</button></div></div>
        <button class="primary" id="submitButton" type="submit">Save new password</button>
      </form>
      <div id="successActions" class="hidden"><a class="link" href="auth.html">Return to log in</a></div>
      <div class="links" id="backLink"><a class="link" href="auth.html">Back to log in</a></div>
    </section>
    <p class="fine">Never share your password or password reset link with anyone.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const API_BASE = 'https://tradezora-backend-1.onrender.com';
      const $ = (id) => document.getElementById(id);
      const form = $('resetForm');
      const message = $('message');
      const token = new URLSearchParams(window.location.search).get('token') || '';

      function showMessage(text, kind = 'error') {
        message.textContent = text;
        message.className = 'message ' + kind;
      }
      function setBusy(busy) {
        const button = $('submitButton');
        button.disabled = busy;
        button.textContent = busy ? 'Saving…' : 'Save new password';
      }

      document.querySelectorAll('[data-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const input = $(button.dataset.toggle);
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          button.textContent = show ? 'Hide' : 'Show';
        });
      });

      if (!token) {
        form.classList.add('hidden');
        $('backLink').classList.remove('hidden');
        showMessage('This reset link is missing its token. Return to login and request a new password reset.');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.className = 'message';
        const password = $('newPassword').value;
        const confirmPassword = $('confirmPassword').value;
        if (!token) return showMessage('This reset link is invalid. Request a new one from the login page.');
        if (password.length < 8) return showMessage('Your new password must be at least 8 characters.');
        if (password !== confirmPassword) return showMessage('The passwords do not match.');

        setBusy(true);
        try {
          let response;
          try {
            response = await fetch(API_BASE + '/api/auth/reset-password', {
              method: 'POST',
              headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
              body: JSON.stringify({token, password})
            });
          } catch (_) {
            throw new Error('Could not reach the server. Check your internet connection and try again.');
          }
          let data;
          try { data = await response.json(); }
          catch (_) { throw new Error('The server returned an unreadable response. Please try again later.'); }
          if (!response.ok || data.success === false) {
            throw new Error(data.error || 'This password reset link is invalid or has expired.');
          }
          form.classList.add('hidden');
          $('backLink').classList.add('hidden');
          $('successActions').classList.remove('hidden');
          showMessage(data.message || 'Your password has been reset. You can now log in with your new password.', 'ok');
        } catch (error) {
          showMessage(error.message || 'Could not reset your password. Please request a new link.');
        } finally {
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
